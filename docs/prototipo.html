<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Paritario</title>
<style>
  /* Layout: fixed sidebar + topbar, scrollable content; views toggled by JS. Prototype with sample data. */
  :root{
    --bg:#eef1f3; --surface:#ffffff; --surface-2:#f5f7f8; --border:#dde3e6;
    --fg:#141b1f; --muted:#5a6b72; --faint:#8697a0;
    --accent:#0f766e; --accent-soft:#d5ebe8; --accent-fg:#ffffff;
    --ok:#15803d; --ok-soft:#dcf0e2; --warn:#b45309; --warn-soft:#fbeccf; --crit:#b91c1c; --crit-soft:#f7dada;
    --shadow:0 1px 2px rgba(16,30,36,.06),0 2px 10px rgba(16,30,36,.05);
    --r:12px;
    --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
    --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0c1114; --surface:#141b1f; --surface-2:#1a2328; --border:#28343a;
    --fg:#e8eef1; --muted:#9db0b8; --faint:#6b7d85;
    --accent:#2dd4bf; --accent-soft:#113b38; --accent-fg:#06211e;
    --ok:#4ade80; --ok-soft:#10301d; --warn:#fbbf24; --warn-soft:#3a2a09; --crit:#f87171; --crit-soft:#3a1414;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 12px rgba(0,0,0,.35);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0c1114; --surface:#141b1f; --surface-2:#1a2328; --border:#28343a;
    --fg:#e8eef1; --muted:#9db0b8; --faint:#6b7d85;
    --accent:#2dd4bf; --accent-soft:#113b38; --accent-fg:#06211e;
    --ok:#4ade80; --ok-soft:#10301d; --warn:#fbbf24; --warn-soft:#3a2a09; --crit:#f87171; --crit-soft:#3a1414;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 12px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
  .mono{font-family:var(--f-mono)}
  .num{font-variant-numeric:tabular-nums}

  .app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
  /* Sidebar */
  .side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-block:18px}
  .brand{display:flex;align-items:center;gap:10px;padding:0 20px 18px;border-bottom:1px solid var(--border);margin-bottom:10px}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);flex:none}
  .brand b{font-family:var(--f-display);font-size:18px;letter-spacing:-.02em}
  .brand small{display:block;color:var(--faint);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  nav{display:flex;flex-direction:column;gap:2px;padding:8px 12px;overflow:auto}
  .nav-lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:12px 8px 4px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit}
  .nav-item:hover{background:var(--surface-2);color:var(--fg)}
  .nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav-item svg{width:18px;height:18px;flex:none}
  .nav-item .pill{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--crit-soft);color:var(--crit);padding:1px 7px;border-radius:12px}
  .side-foot{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--border)}
  .userbox{display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--accent)}

  /* Topbar */
  main{min-width:0;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
       display:flex;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-right,0)) 12px max(16px,env(safe-area-inset-left,0))}
  .crumbs{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;min-width:0}
  .crumbs b{color:var(--fg);font-weight:600}
  .crumbs .sep{color:var(--faint)}
  .roleswitch{margin-left:auto;display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px}
  .roleswitch button{border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);padding:5px 11px;border-radius:7px;cursor:pointer}
  .roleswitch button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
  .iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .iconbtn:hover{color:var(--fg)}

  .wrap{padding:24px max(16px,env(safe-area-inset-right,0)) 48px max(16px,env(safe-area-inset-left,0));width:100%;max-width:1120px;margin:0 auto}
  .ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .ph h1{font-size:26px}
  .ph p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
  .btn{font-family:inherit;font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
  .btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--border)}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .btn svg{width:15px;height:15px}

  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
  .kpi .v{font-family:var(--f-display);font-size:34px;line-height:1.1;margin-top:8px;letter-spacing:-.02em}
  .kpi .sub{font-size:12px;color:var(--faint);margin-top:3px}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}

  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
  .card-h h3{font-size:15px}
  .card-h a{font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer}
  .card-b{padding:8px 18px 16px}

  /* compliance bars */
  .barrow{display:grid;grid-template-columns:120px 1fr 42px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
  .barrow:last-child{border-bottom:none}
  .barrow .rg{font-size:12.5px;color:var(--muted)}
  .track{height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden}
  .fill{height:100%;border-radius:6px}
  .barrow .pc{font-size:12.5px;font-weight:700;text-align:right}

  /* alerts */
  .alert{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);align-items:flex-start}
  .alert:last-child{border-bottom:none}
  .alert .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
  .alert .ti{font-size:13.5px;font-weight:600}
  .alert .de{font-size:12px;color:var(--muted)}

  /* table */
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
  thead th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--border)}
  tbody tr.clk{cursor:pointer}
  tbody tr.clk:hover{background:var(--surface-2)}
  .cname{font-weight:600}
  .csub{font-size:11.5px;color:var(--faint)}

  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
  .chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.mut{background:var(--surface-2);color:var(--muted)}
  .chip.gold{background:#f6e6c3;color:#8a6212} .chip.silver{background:#e3e7ea;color:#5c6a72} .chip.bronze{background:#eedcc9;color:#8a5a2c}
  :root[data-theme="dark"] .chip.gold{background:#3a2f12;color:#e0c070}
  :root[data-theme="dark"] .chip.silver{background:#2a3137;color:#aeb9c0}
  :root[data-theme="dark"] .chip.bronze{background:#33251a;color:#cf9a68}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.gold{background:#3a2f12;color:#e0c070}:root:not([data-theme="light"]) .chip.silver{background:#2a3137;color:#aeb9c0}:root:not([data-theme="light"]) .chip.bronze{background:#33251a;color:#cf9a68}}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters input,.filters select{font-family:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--fg)}
  .filters input{flex:1;min-width:160px}

  /* detail */
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;margin-bottom:12px;padding:0}
  .back:hover{color:var(--fg)}
  .dhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
  .dhead h1{font-size:24px}
  .meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:8px}
  .meta b{color:var(--fg);font-weight:600}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:20px 0 18px;overflow-x:auto}
  .tab{border:none;background:none;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}

  .people{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .plist{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .plist .hd{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .person{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--border)}
  .person:last-child{border-bottom:none}
  .person .av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
  .person .nm{font-weight:600;font-size:13.5px}
  .person .rl{font-size:11.5px;color:var(--muted)}
  .person .tags{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .person .tag{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:14px}
  .person .tag.afor{color:var(--warn);background:var(--warn-soft)}

  /* meetings timeline */
  .months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .mo{border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;background:var(--surface)}
  .mo .mn{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
  .mo .st{margin-top:7px;font-size:11.5px;font-weight:700}
  .mo.done{border-color:var(--ok);background:var(--ok-soft)} .mo.done .st{color:var(--ok)}
  .mo.plan{border-style:dashed} .mo.plan .st{color:var(--muted)}
  .mo.miss{border-color:var(--crit);background:var(--crit-soft)} .mo.miss .st{color:var(--crit)}
  .mo.pend{border-color:var(--warn);background:var(--warn-soft)} .mo.pend .st{color:var(--warn)}
  .mo.na{opacity:.45;border-style:dashed}

  .doc{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
  .doc:last-child{border-bottom:none}
  .doc .fi{width:34px;height:40px;border-radius:5px;background:var(--crit-soft);color:var(--crit);display:grid;place-items:center;font-size:9px;font-weight:800;flex:none}
  .doc .nm{font-weight:600;font-size:13.5px}
  .doc .dt{font-size:11.5px;color:var(--faint)}

  /* kanban */
  .segtip{font-size:12.5px;color:var(--muted);margin:0 0 14px}
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
  .kcol{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:10px;min-width:0}
  .kcol>.kh{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:700;font-size:13px}
  .kcol>.kh .cnt{margin-left:auto;font-size:11px;color:var(--faint);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1px 8px}
  .kdot{width:9px;height:9px;border-radius:50%;flex:none}
  .kcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px;box-shadow:var(--shadow);margin-bottom:9px}
  .kcard:last-child{margin-bottom:0}
  .kcard .tt{font-size:13px;font-weight:600;line-height:1.35}
  .kcard .mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .kcard .mt .chip{font-size:10.5px;padding:2px 8px}
  .kcard .cm{font-size:11px;color:var(--faint);margin-top:8px;display:flex;align-items:center;gap:6px}

  .comis{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .comcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .comcard .ch{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .comcard .ch .ic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
  .comcard .ch .nm{font-weight:700;font-size:13.5px;line-height:1.25}

  .fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
  .fld{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fld.full{grid-column:1/-1}
  .fld label{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
  .fld input,.fld select,.fld textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
  .fld textarea{min-height:64px;resize:vertical}
  .fld .hint{font-size:11.5px;color:var(--faint)}
  .sug{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:12px;white-space:nowrap}
  .notice{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px}
  .notice.warn{background:var(--warn-soft)} .notice.info{background:var(--accent-soft)}
  .notice svg{flex:none;width:18px;height:18px;margin-top:1px}
  .notice.warn svg{color:var(--warn)} .notice.info svg{color:var(--accent)}
  .stack{display:flex;flex-direction:column;gap:14px}
  .ilist{display:flex;flex-direction:column}
  .iitem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
  .iitem:last-child{border-bottom:none}
  .iitem .grow{flex:1;min-width:0}
  .jer{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
  .jer.ok{background:var(--ok-soft);color:var(--ok)} .jer.accent{background:var(--accent-soft);color:var(--accent)}
  .jer.warn{background:var(--warn-soft);color:var(--warn)} .jer.crit{background:var(--crit-soft);color:var(--crit)}
  .xbtn{border:none;background:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
  .xbtn:hover{color:var(--crit);background:var(--crit-soft)}
  .addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .addrow input,.addrow select{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0}
  .addrow input{flex:1;min-width:160px}
  .linkbtn{border:none;background:none;color:var(--accent);font-family:inherit;font-weight:600;font-size:12.5px;cursor:pointer;padding:0}
  .agg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:860px){.agg{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){.fgrid{grid-template-columns:1fr}}
  @media(max-width:680px){
    .top{flex-wrap:wrap;row-gap:10px}
    .top .crumbs{flex:1}
    .roleswitch{order:3;margin-left:0;width:100%}
    .roleswitch button{flex:1;padding:6px 4px}
  }
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty svg{width:40px;height:40px;opacity:.4;margin-bottom:10px}

  @media(max-width:860px){ .kpis{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr} .people{grid-template-columns:1fr} .comis{grid-template-columns:1fr} .months{grid-template-columns:repeat(3,1fr)} .kanban{grid-template-columns:1fr} }
  @media(max-width:680px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:-260px;transition:left .2s;z-index:40;width:240px;box-shadow:var(--shadow)}
    .side.open{left:0}
    .menubtn{display:grid!important}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}
    .scrim.open{display:block}
  }
  .menubtn{display:none}
  .scrim{display:none}
</style>

<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3l7 3v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
      </span>
      <span><b id="brandName">Paritario</b><small id="brandSub">Comités · Prototipo</small></span>
    </div>
    <nav id="nav">
      <div class="nav-lbl">General</div>
      <button class="nav-item on" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Panel</button>
      <button class="nav-item" data-view="comites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.2"/><path d="M22 21v-2a4 4 0 0 0-3-3.8"/><path d="M16 3.3A4 4 0 0 1 16 11"/></svg>Comités</button>
      <button class="nav-item" data-view="reuniones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>Reuniones</button>

  } else if(detailTab==="comisiones"){

        <div class="person"><span class="av">${inic(pick(i))}</span><span><div class="nm">${esc(pick(i))}</div><div class="rl">Responsable</div></span></div>

      </div>`;

  } else if(detailTab==="programa"){

      ${ACTS.filter(a=>a[1]===st).map(a=>`<div class="kcard"><div class="tt">${esc(a[0])}</div>
        <div class="mt"><span class="chip ${a[3]==='oblig'?'':'mut'}" style="${a[3]==='oblig'?'background:var(--warn-soft);color:var(--warn)':''}">${a[3]==='oblig'?'Obligatoria':'Recomendada'}</span><span class="chip mut">${esc(a[2])}</span></div>
        <div class="cm"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M4 20a5 5 0 0 1 10 0"/></svg>${esc(a[4])}</div></div>`).join("")||'<div style="padding:10px 6px;color:var(--faint);font-size:12px">Sin actividades</div>'}</div>`;

      <button class="btn sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Añadir actividad</button></div>
      <div class="kanban">${KCOLS.map(k=>col(k[0])).join("")}</div>`;

  } else if(detailTab==="cronograma"){
    const est=c.meetings.map(estadoMes),cnt=k=>est.filter(m=>m===k).length,done=cnt("done"),miss=cnt("miss"),pend=cnt("pend"),plan=cnt("plan"),na=cnt("na");
    const LBL={done:"Realizada",miss:"No realizada",pend:"Sin registrar",plan:"Planificada",na:"No aplica"};
    tb.innerHTML=`<div class="card"><div class="card-h"><h3>Reuniones mensuales · 2026</h3><span class="num" style="font-size:13px;color:${p>=90?'var(--ok)':p>=70?'var(--warn)':'var(--crit)'};font-weight:700">${p}% cumplimiento</span></div>
      <div class="card-b"><div class="months">${est.map((m,i)=>`<div class="mo ${m}"><div class="mn">${MES[i]}</div><div class="st">${LBL[m]}</div></div>`).join("")}</div>
      <p class="segtip" style="margin:14px 0 0">${done} realizadas · ${miss} no realizadas${pend?` · ${pend} sin registrar`:""} · ${plan} planificadas${na?` · ${na} no aplican`:""}. Según el DS 44, el comité debe reunirse al menos una vez al mes y dejar acta de cada sesión. Un mes ya terminado sin reunión registrada cuenta como incumplido; los meses antes de la constitución o después de la disolución no se exigen.</p></div></div>`;

  } else if(detailTab==="actas"){
    tb.innerHTML=`<div class="card"><div class="card-h"><h3>Actas y documentos</h3><button class="btn ghost sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3M7 10l5 5 5-5M5 21h14"/></svg>Subir documento</button></div>
      <div>${c.actas.map(a=>`<div class="doc"><span class="fi">PDF</span><span style="flex:1;min-width:0"><div class="nm">${esc(a[0])}</div><div class="dt">Cargada el ${fdate(a[1])}</div></span><span class="chip ok">Vigente</span></div>`).join("")}</div></div>`;

  } else {
    tb.innerHTML=ct?`<div class="card"><div class="card-h"><h3>Certificación</h3></div><div class="card-b">
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><span class="chip ${ct[1]}" style="font-size:14px;padding:6px 14px">Nivel ${ct[0]}</span>
      <span style="color:var(--muted);font-size:13.5px">Auditoría vigente · próxima revisión ${fdate(c.prox)}</span></div>
      <div class="meta" style="margin-top:16px"><span>Auditor <b>Auditor asignado por la empresa</b></span><span>Resultado <b>Aprobado</b></span><span>Norma <b>DS 44</b></span></div></div></div>`
      :`<div class="card"><div class="card-b"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5L7 22l5-2.5L17 22l-1.5-8.5"/></svg><div>Este comité no tiene auditoría de certificación registrada.</div><button class="btn" style="margin-top:14px">Solicitar auditoría</button></div></div></div>`;
  }
}


function invOpts(list, sel, fmt){ return list.map(x=>`<option value="${esc(x.c)}" ${x.c===sel?'selected':''}>${esc(fmt?fmt(x):x.c+' · '+x.d)}</option>`).join(""); }
function renderInvestigaciones(c, tb){

      <div class="agg">
        <div class="kpi"><div class="lbl">Accidentes del trabajo</div><div class="v num">${n("accidente_trabajo")}</div></div>

  tb.innerHTML=`<div class="notice warn">${lock}<div>Datos de salud. Solo la empresa y el comité ven estos casos; el organismo ve únicamente totales. Datos de ejemplo.</div></div>
    <div class="kpis">
      <div class="kpi"><div class="lbl"><span class="dot" style="background:var(--accent)"></span>Casos 2026</div><div class="v num">${casos.length}</div><div class="sub">${casos.filter(i=>i.tipo==="enfermedad_profesional").length} enfermedad(es) profesional(es)</div></div>
      <div class="kpi"><div class="lbl"><span class="dot" style="background:var(--crit)"></span>Graves o fatales</div><div class="v num">${casos.filter(i=>i.grav!=="leve").length}</div><div class="sub">requieren investigación prioritaria</div></div>
      <div class="kpi"><div class="lbl"><span class="dot" style="background:var(--warn)"></span>Días perdidos</div><div class="v num">${casos.reduce((s,i)=>s+(+i.dias||0),0)}</div><div class="sub">en el año</div></div>
      <div class="kpi"><div class="lbl"><span class="dot" style="background:var(--warn)"></span>Investigaciones abiertas</div><div class="v num">${abiertas}</div><div class="sub">${casos.length-abiertas} cerrada(s)</div></div>
    </div>
    <div class="card"><div class="card-h"><h3>Investigaciones del comité</h3><button class="btn sm" data-newinv="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Nueva investigación</button></div>
    <div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Gravedad</th><th>Persona afectada</th><th>Forma / agente</th><th>Estado</th></tr></thead><tbody>
    ${casos.map(i=>{const g=GRAV[i.grav],e=EST_INV[i.estado];
      const cod=i.tipo==="enfermedad_profesional"?(AGENF[i.agEnf]?"Agente: "+AGENF[i.agEnf].d:"Sin codificar"):(FORMA[i.forma]?FORMA[i.forma].d:"Sin codificar");
      return `<tr class="clk" data-inv="${i.id}"><td class="num">${fdate(i.fecha)}</td><td>${TIPO_INV[i.tipo]}<div class="csub">${esc(i.folio||"sin folio")}</div></td>
        <td><span class="chip ${g[1]}">${g[0]}</span></td><td>${esc(i.afectado||"—")}</td><td style="max-width:260px"><div class="csub" style="white-space:normal">${esc(cod)}</div></td>
        <td><span class="chip ${e[1]}">${e[0]}</span></td></tr>`;}).join("")||'<tr><td colspan="6"><div class="empty">Este comité no tiene investigaciones registradas.</div></td></tr>'}
    </tbody></table></div></div>`;
  tb.onclick=e=>{
    const r=e.target.closest("[data-inv]"); if(r){invSel=+r.dataset.inv;vComite(c.id);return;}

      const n={id:++invSeq,comite:c.id,tipo:"accidente_trabajo",grav:"leve",fecha:new Date().toISOString().slice(0,10),folio:"",afectado:"",dias:0,estado:"abierta",cierre:"",desc:"",causa:"",forma:"",agente:"",lesion:"",ubic:"",agEnf:"",causas:[],medidas:[]};

    }
  };
}
function renderInvDetalle(c, tb, inv){

        <div class="fld"><label for="i-tipo">Tipo</label><select id="i-tipo" data-f="tipo" data-r="1">${Object.entries(TIPO_INV).map(([k,v])=>`<option value="${k}" ${k===inv.tipo?'selected':''}>${v}</option>`).join("")}</select></div>
        <div class="fld"><label for="i-grav">Gravedad</label><select id="i-grav" data-f="grav" data-r="1">${Object.entries(GRAV).map(([k,v])=>`<option value="${k}" ${k===inv.grav?'selected':''}>${v[0]}</option>`).join("")}</select></div>

        <div class="fld"><label for="i-dias">Días perdidos</label><input id="i-dias" type="number" min="0" data-f="dias" value="${+inv.dias||0}"></div>

      </div></div></div>

      <div class="card"><div class="card-h"><h3>Codificación SISESAT</h3><span class="csub">Manual Técnico de Codificación de la SUSESO</span></div><div class="card-b" style="padding-top:14px"><div class="fgrid">
      ${ep?`
        <div class="fld full"><label for="i-agenf">Agente causal de la enfermedad (Anexo IX)</label><select id="i-agenf" data-f="agEnf"><option value="">Seleccione…</option>${invOpts(SIS.agEnf,inv.agEnf)}</select>

        <div class="addrow"><select id="i-nmed-j">${JER.map((x,k)=>`<option value="${x[0]}">${k+1}. ${x[1]}</option>`).join("")}</select><input id="i-nmed" placeholder="Describa la medida"><button class="btn ghost sm" data-addmed="1">Agregar medida</button></div>
        ${inv.medidas.some(m=>m.prog)?`<div style="margin-top:12px"><button class="linkbtn" data-tabgo="programa">Ver en el programa de trabajo →</button></div>`:''}

      <div class="card"><div class="card-h"><h3>Estado de la investigación</h3></div><div class="card-b" style="padding-top:14px"><div class="fgrid">
        <div class="fld"><label for="i-estado">Estado</label><select id="i-estado" data-f="estado" data-r="1">${Object.entries(EST_INV).map(([k,v])=>`<option value="${k}" ${k===inv.estado?'selected':''}>${v[0]}</option>`).join("")}</select></div>

      <div class="card"><div class="card-h"><h3>Documentos de la investigación</h3><button class="btn ghost sm" type="button">Subir documento</button></div><div class="card-b">
        <div class="ilist">
          <div class="iitem"><span style="flex:1;min-width:0">Informe de investigación ${esc(inv.folio||"")}.pdf<div style="font-size:11.5px;color:var(--faint)">Cargado ${fdate(inv.fecha)}</div></span><span class="chip crit">Datos de salud</span></div>
        </div>

        <td><span class="chip ${c[4]==="vigente"?"ok":"mut"}">${c[4]==="vigente"?"Vigente":"No vigente"}</span></td></tr>`;}).join("")}</tbody></table></div></div>`;
}

function vSimple(title,sub,icon){
  wrap.innerHTML=`<div class="ph"><div><h1>${title}</h1><p>${sub}</p></div></div>
    <div class="card"><div class="card-b"><div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${icon}</svg>
      <div>Módulo del prototipo — aquí iría ${title.toLowerCase()}.</div>
      <div style="font-size:12.5px;margin-top:6px">En el sistema real este módulo consume la misma API que el resto.</div></div></div></div>`;
}

/* ---------- router ---------- */
const TITLES={dashboard:"Panel",comites:"Comités",reuniones:"Reuniones",cert:"Certificación",centros:"Centros de trabajo",empresas:"Empresas adheridas",marca:"Marca e integraciones",accesos:"Accesos",usuarios:"Usuarios y roles"};
function setCrumb(parts){$("#crumbs").innerHTML=parts.map((p,i)=>i===parts.length-1?`<b>${esc(p)}</b>`:`<span>${esc(p)}</span><span class="sep">/</span>`).join("");}
function go(view,arg){
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("on",n.dataset.view===view));
  $("#side").classList.remove("open");$("#scrim").classList.remove("open");
  if(view==="comite"){setCrumb(["Comités",comites.find(c=>c.id===arg)?.name||"Detalle"]);vComite(arg);window.scrollTo(0,0);return;}
  setCrumb([TITLES[view]||view]);
  ({dashboard:vDashboard,comites:vComites,accesos:vAccesos,empresas:vEmpresas,marca:vMarca,
    reuniones:()=>vSimple("Reuniones","Calendario y actas de todas las reuniones",'<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/>'),
    cert:()=>vSimple("Certificación","Auditorías y niveles de certificación",'<circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5L7 22l5-2.5L17 22l-1.5-8.5"/>'),
    centros:vCentros,
    usuarios:vUsuarios,
  }[view]||vDashboard)();
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
$("#nav").onclick=e=>{const b=e.target.closest(".nav-item");if(b)go(b.dataset.view);};
wrap.addEventListener("click",e=>{
  if(e.target.closest("[data-ap],[data-rj]"))return;
  const row=e.target.closest("[data-comite]");if(row){go("comite",+row.dataset.comite);return;}
  const g=e.target.closest("[data-go]");if(g)go(g.dataset.go);
});
$("#roleswitch").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  $("#roleswitch").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  $("#roleFoot").textContent=b.dataset.role;
  const org=!!b.dataset.org, root=document.documentElement.style;
  ROLE=org?"organismo":"empresa"; invSel=null;
  document.querySelectorAll(".org-only").forEach(el=>el.hidden=!org);
  if(org){root.setProperty("--accent",ORG.color);root.setProperty("--accent-soft","color-mix(in srgb, "+ORG.color+" 18%, transparent)");root.setProperty("--accent-fg","#ffffff");
    $("#brandName").textContent=ORG.marca;$("#brandSub").textContent="Marca blanca · ejemplo";go("empresas");}
  else{["--accent","--accent-soft","--accent-fg"].forEach(v=>root.removeProperty(v));
    $("#brandName").textContent="Paritario";$("#brandSub").textContent="Comités · Prototipo";
    if(document.querySelector(".nav-item.on.org-only"))go("dashboard");}};
$("#menubtn").onclick=()=>{$("#side").classList.add("open");$("#scrim").classList.add("open");};
$("#scrim").onclick=()=>{$("#side").classList.remove("open");$("#scrim").classList.remove("open");};
// theme toggle
(function(){let t=null;try{t=localStorage.getItem("pari-theme");}catch(e){}if(t)document.documentElement.setAttribute("data-theme",t);
  $("#themebtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");
    const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;const n=dark?"light":"dark";
    document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("pari-theme",n);}catch(e){}};})();

go("dashboard");
</script>
